[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bapred2"
version = "0.1.0"
description = "Recurrent graph inference for protein-ligand binding affinity prediction"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Jaemin Sim" }]
dependencies = [
  "torch>=2.14.0",
  "torch-geometric>=2.8.0",
  "rdkit>=2026.3.6",
  "numpy>=2.3",
  "pandas>=3.0",
  "scipy>=1.18",
  "pyyaml>=6.0.3",
  "tqdm>=4.67",
]

[project.scripts]
bapred2-train = "bapred2.train:main"
bapred2-eval = "bapred2.evaluate:main"
bapred2-preprocess = "bapred2.data.preprocess:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pinned so CI does not drift with ruff's expanding default rule set.
select = ["E4", "E7", "E9", "F", "UP", "I"]
